server:
  port: 8080

spring:
  application:
    name: Smart-Expense
  datasource:
    # docker-compose 把 MySQL 映射到 3307（本机 3306 已被本地 MySQL80 占用）
    # 用本地 MySQL 时：DB_PORT=3306，并提供 DB_PASSWORD
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/smart_expense?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # 页面壳（templates/*.html）目前是纯客户端渲染，没有任何 th:* 绑定，
  # 因此直接作为静态资源对外服务：省掉 Thymeleaf 依赖，页面与 /js /css 的绝对路径天然对齐。
  # 将来真要用服务端渲染（th:*），删掉下面两行并把页面交给 ViewController 即可。
  web:
    resources:
      static-locations: classpath:/static/,classpath:/templates/
  # RabbitMQ（docker-compose 映射 5672/15672），拓扑声明见 config/RabbitConfig.java
  rabbitmq:
    host: ${MQ_HOST:127.0.0.1}
    port: ${MQ_PORT:5672}
    username: ${MQ_USERNAME:guest}
    password: ${MQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
  # 发票上传（v2 方案 A）：multipart 大小上限，文件落本地目录
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# 发票文件本地存储目录（相对启动目录；生产切 MinIO 时改实现，契约不变）
app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  # 发票识别链路（docs/11 §3）：默认 mock，接真实模型只改这里的开关与 key
  invoice:
    confidence-threshold: ${INVOICE_CONFIDENCE_THRESHOLD:0.85}
    recognizer:
      # 按顺序尝试：primary 失败/超时才降级到 fallback（docs/11 §3.2）
      primary: ${INVOICE_RECOGNIZER_PRIMARY:mock}
      fallback: ${INVOICE_RECOGNIZER_FALLBACK:}
      timeout-ms: ${INVOICE_RECOGNIZER_TIMEOUT_MS:20000}
      # true 时才注册 qwen-vl 识别器（需要 DASHSCOPE_API_KEY）
      qwen-enabled: ${INVOICE_QWEN_ENABLED:false}

# AI 审批 Copilot（docs/11 §5）。API Key 只从环境变量读取，禁止写进仓库。
ai:
  provider: ${AI_PROVIDER:mock}          # mock / qwen
  base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${DASHSCOPE_API_KEY:}
  text-model: ${AI_TEXT_MODEL:qwen-plus}
  vl-model: ${AI_VL_MODEL:qwen3-vl-plus}   # 2026-10 实测可用；qwen-vl-max 已报 model_not_found
  agent:
    max-steps: 5
    total-timeout-ms: 8000
    step-timeout-ms: 3000
    max-tool-result-bytes: 2048

# 审批 SLA（docs/02 §7）：定时扫描超时节点，先提醒后升级
approval:
  sla:
    enabled: ${SLA_ENABLED:true}
    # 每 10 分钟扫一次；cron 六段：秒 分 时 日 月 周
    cron: ${SLA_CRON:0 */10 * * * *}
    # 同一节点提醒间隔（小时），避免每轮扫描都写一条审计
    remind-interval-hours: ${SLA_REMIND_HOURS:1}

# 认证（docs/12）：默认 jwt；header 兼容模式必须显式 AUTH_COMPAT=true 才启用（docs/12 §7）
auth:
  mode: ${AUTH_MODE:jwt}
  compat: ${AUTH_COMPAT:false}
  # 生产必须通过环境变量替换，长度 >= 32 字节
  jwt-secret: ${JWT_SECRET:smart-expense-dev-secret-key-please-change-32}
  token-ttl-minutes: ${JWT_TTL_MINUTES:120}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# 日志带 traceId（docs/10）：由 UserContextFilter 写入 MDC，业务审计字段另有 traceId
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
