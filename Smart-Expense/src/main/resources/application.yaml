server:
  port: 8080

spring:
  application:
    name: Smart-Expense
  datasource:
    # docker-compose 把 MySQL 映射到 3307（本机 3306 已被本地 MySQL80 占用）
    # 用本地 MySQL 时：DB_PORT=3306，并提供 DB_PASSWORD
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/smart_expense?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # RabbitMQ（docker-compose 映射 5672/15672），拓扑声明见 config/RabbitConfig.java
  rabbitmq:
    host: ${MQ_HOST:127.0.0.1}
    port: ${MQ_PORT:5672}
    username: ${MQ_USERNAME:guest}
    password: ${MQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

# AI 审批 Copilot（docs/11 §5）。API Key 只从环境变量读取，禁止写进仓库。
ai:
  provider: ${AI_PROVIDER:mock}          # mock / qwen
  base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${DASHSCOPE_API_KEY:}
  text-model: ${AI_TEXT_MODEL:qwen-plus}
  vl-model: ${AI_VL_MODEL:qwen-vl-max}
  agent:
    max-steps: 5
    total-timeout-ms: 8000
    step-timeout-ms: 3000
    max-tool-result-bytes: 2048

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
